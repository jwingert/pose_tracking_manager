  "right_chimney_headphones-r0001",
  "right_chimney_headphones-r0002",
]
geometry = { chimney = ["right"], audio = ["in-ear"], stream = ["arena"] }
qc = "rigid"
bodyparts = ["front", "back", "leftheadphone", "rightheadphone", "shoulders", "midriff", "rear"]   # r0002 (2026-08-23) dropped the four port markers
rules = []


# --- known issues ---------------------------------------------------------------
# Latent faults inherited from the legacy router and DELIBERATELY PRESERVED by this
# migration.  Fixing any of them changes behaviour and is a separate, visible decision.
[known_issues]

dead_free_top_2022_11 = """\
The legacy 'PRN00'..'PRN03' branch assigned \
/auto/data/dlc/free_top_2022_11/config.yaml and then immediately overwrote it with \
left_chimney_PRNfb-svd-2024-01-11 on the next line.  The first assignment was dead \
code and never had any effect, so free_top_2022_11 is intentionally absent from this \
registry."""

rei_097_102_unroutable = """\
REI sites 97 and 102 have headphone labels in \
headphones_left_chimney_LB1_pokes-jcw-2025-04-22, but the legacy chain's headphone \
branch requires site in [68, 70, 74], so those sites fall through to `raise \
ValueError('No DLC model specified for this path')`.  The registry reproduces the \
raise.  Whoever analyzed those sessions must have passed the config path explicitly."""

eager_site_parse = """\
The legacy function evaluated `sitenum = int(avipath.split('/')[5][3:])` BEFORE any \
branch was tested.  Three consequences are preserved verbatim by \
dlc_registry._site_number, which is called eagerly for the same reason:
 (a) '/auto/data/daq/<Animal>/training/x.avi' raises ValueError on int('ning'), so the \
     behavior_only rules ('LemonDisco/training', 'SlipperyJack/training') and the \
     right_chimney_pokes 'StinkySquid/training2024' rule are UNREACHABLE through the \
     router, even though ~70 .dlc.h5 files on disk came from free_train-svd-2023-09-26. \
     Those must have been produced by passing the config path explicitly.
 (b) A path with fewer than six '/'-separated components raises IndexError, not \
     ValueError.
 (c) 'video_pupil' is tested AFTER the eager int(), so a pupil video under a \
     non-numeric penname raises instead of resolving to the `pupil` alias.
The index 5 also hard-codes the /auto/data/daq/<animal>/<penname>/ layout: any path \
not of that shape raises."""
