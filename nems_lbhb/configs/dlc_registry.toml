# many different sizes (312x202 ... 684x468), so "the frame size this model was
# trained at" is not a well-defined number for it.  The [640, 480] default is
# inert here anyway -- every video_pupil.avi in the tree is 640x480 native, and
# rescaling only fires on a video LARGER than the declared size.
[alias.pupil]
description = "Pupil / eyelid close-up camera."
project = "/auto/data/dlc/eyecloseup"
current = "pupil-r0001"
history = [
  "pupil-r0001",
]
