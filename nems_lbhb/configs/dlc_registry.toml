# --- not routed by path --------------------------------------------------------
# `rules = []` below is LOAD-BEARING, not an omission.  These aliases are named by a
# caller; they must never be reachable from a video path.
#
# For `face` that is simply how it is used: nems_lbhb/motor/face_fit_script.py names it.
#
# For `right_chimney_headphones` it is a constraint.  The legacy router RAISES
# ValueError('No DLC model specified for this path') for StinkySquid sites above 20 --
# rule 6 catches SQD only up to site 20 and nothing else matches SQD -- and
# tests/test_dlc_registry.py locks that in against a frozen copy of the legacy function
# over every video in the lab inventory.  Giving this alias a `path_contains =
# "StinkySquid/SQD"` rule would start answering where the legacy chain raised, which is a
# behaviour change, not a migration.  Whoever analyzes a right-chimney headphone session
# passes `alias=right_chimney_headphones` explicitly (dlc_fit_script supports it).
# No train_frame_size, for the same reason as `pupil`: multivid-CLL's labelled
# images are 360x240 close-up crops, and this alias is driven by face_fit_script.py,
# which does not go through dlc_fit_script's rescaling path at all.  Declaring
# [360, 240] here would assert a downscale nobody has measured.
[alias.face]
description = "Face / lick close-up camera. Chosen explicitly by face_fit_script.py."
project = "/auto/data/dlc/multivid-CLL-2022-01-14"
current = "face-r0001"
history = [
  "face-r0001",
]
geometry = { stream = ["face"] }
qc = "none"
bodyparts = ["topeyelid", "bottomeyelid", "nose", "chin", "tongue", "ear", "whisker1"]
rules = []

