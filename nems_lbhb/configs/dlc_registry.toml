# DeepLabCut model registry.
#
# This file is the single source of truth for "which DLC model analyzes which video".
# It replaces the 45-line if/elif chain that used to live in
# nems_lbhb/motor/nems_dlc_settings.get_dlc_model.  It is read by
# nems_lbhb/motor/dlc_registry.py, which imports nothing but the standard library so
# that py3.8 (streamlit_dlc), py3.9 (psi_nems2) and the production DLC env can all
# load it.
#
# ORDER IS SEMANTICS.  resolve_for_video() walks the [alias.*] blocks in the order
# they appear here, and each alias's `rules` list in order, and takes the FIRST match
# -- exactly as the if/elif chain did.  The blocks below are in the legacy chain's
# testing order.  Do not reorder them without re-running
# tests/test_dlc_registry.py, which compares this registry against a frozen copy of
# the pre-migration function over every video in the lab inventory.
#
# Predicate vocabulary understood by resolve_for_video (AND within one rule,
# OR across the rules list):
#   path_contains  str or list-of-str (list = OR)
#   site_max       sitenum <= value      (inclusive)
#   site_min       sitenum >= value      (inclusive)
#   site_in        sitenum in list
#   site_not_in    sitenum not in list
#   animal         avipath.split('/')[4] == value  (or list = OR)  [no rule uses this yet]
#   runclass       trailing _XXX token of the video stem            [no rule uses this yet]
#
# `sitenum` is int(avipath.split('/')[5][3:]) -- see _site_number() in dlc_registry.py
# for why that index is hard-coded and why it is evaluated eagerly.
#
# `current` is the frozen release id this alias serves in production.  While it is
# "" the alias resolves straight to its live training project (source='project').
# Task 6 cuts the real releases and fills these in.
#
# `train_frame_size = [w, h]` is OPTIONAL and defaults to [640, 480]
# (dlc_registry.DEFAULT_TRAIN_FRAME_SIZE).  It is the frame size the alias's
# labelled data is at, and nems_lbhb/motor/dlc_video_scale.py uses it to decide
# whether a video must be downscaled before inference: a ResNet pose model has no
# scale invariance to spare, and 13 legacy Prince sites (Nov 2022 - Feb 2023) were
# recorded at 1280x720 where every arena project's labelled frames are 640x480.
# On PRN043a05 that costs the worst rigid marker 0.334 tracked at native vs 0.848
# on a 640x360 copy.  It is a property of the model's TRAINING DATA, which is why
# it lives on the alias instead of being a constant in the fit script.
# Rescaling only ever fires when a video is LARGER than this; it never upscales.

schema_version = 1

# maxiters: measured, not assumed. The 2026-08-09 run of the merged right-chimney model
# to 200000 iterations showed held-out error PLATEAUS after ~50000: test error sat in a
# 6.76-7.64 px noise band from 50k to 200k (6.97 at 50k vs 6.76 at 200k -- 0.21 px for 4x
# the training, with 150k coming in WORSE than 50k), while train error nearly halved
# 4.19 -> 2.29. That is overfitting as a widening gap rather than a validation rise.
# An earlier argument from DLC's learning-rate schedule -- [[0.005,10000],[0.02,430000],
# [0.002,730000],[0.001,1030000]], so a 60000-iteration run never reaches a decay step --
# predicted a real gain from training longer. It did not materialise on this dataset.
# 100000 sits past the plateau with headroom, without spending 10 GPU-hours per retrain.
# saveiters 25000 with max_snapshots_to_keep 10 keeps every checkpoint so the snapshot is
# still chosen from the evaluation curve rather than by position.
# --- per-session camera overrides ------------------------------------------------------
# psi names its video files after the camera SLOT, not the content.  When a USB port
# re-enumerates between sessions the slots swap, and the top-down ceiling view lands in a
# file called video_side/video_side2 while `recording.avi` holds something else.  Nothing
# in the file names, the trial log or celldb records that, so it has to be asserted here.
#
# Each entry names the video that actually holds the ceiling view for one session, and the
# psi camera slot it was recorded on.  The slot matters for ALIGNMENT: baphy_io builds one
# PSIVIDEO stream per slot from that slot's `psivideo_*_frames_written`, and
# baphy_io.load_dlc_trace picks the stream from the cam tag in the DLC filename
# (recording.avi -> no tag -> PSIVIDEO,  |  video_side.avi -> camB  |  video_side2.avi -> camC).
#
# `dlc_fit_script` consults this before choosing which video to analyse, so a re-run cannot
# silently go back to the wrong camera.  Verify by eye across all files at matched
# wall-clock times before adding an entry -- frame counts and fps alone do not identify a
# view.
[camera_override]

[camera_override.REI084a10_a_NFB]
video = "video_side2.avi"
cam_tag = "camC"
verified_by = "wingertj"
verified_date = "2026-08-12"
note = """\
A port re-enumeration put the FACE camera in recording.avi (640x480, 100 fps, 168101 \
frames) and the ceiling view in video_side2.avi (640x480, 30 fps, 50429 frames). \
Confirmed visually across all three files at five matched wall-clock times. The original \
DLC output was the top-down body model run on the face camera and is quarantined as \
sorted/INVALID_facecam_*; see the session's README.CAMERA_SWAP. video_side.avi was NOT \
verified. Files were deliberately NOT renamed: psi's per-slot frame-count columns follow \
the slot, so renaming would break the file<->column correspondence that alignment uses."""


[training_defaults]
net_type = "resnet_50"
augmenter_type = "imgaug"
max_snapshots_to_keep = 10
saveiters = 25000
maxiters = 100000
displayiters = 100
autotune = false
allow_growth = true


# --- 1 -------------------------------------------------------------------------
# legacy: elif 'video_pupil' in avipath
